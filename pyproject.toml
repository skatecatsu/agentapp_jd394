[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skatecatsu-agentapp_jd394"
version = "0.1.0"
description = "按段落统计Agent 应用开发工程师·合成数据的质量分水岭相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "skatecatsu" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://skatecatsu.github.io"
Repository = "https://github.com/skatecatsu/agentapp_jd394"
Issues = "https://github.com/skatecatsu/agentapp_jd394/issues"

[project.scripts]
agentapp_jd394 = "agentapp_jd394:main"

[tool.setuptools]
py-modules = ["agentapp_jd394"]
